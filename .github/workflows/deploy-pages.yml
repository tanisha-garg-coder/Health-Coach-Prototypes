name: Deploy prototypes to GitHub Pages

# Publishes the repo as a static site so the myScout prototypes have a stable,
# public URL that Maze can point a usability test at. Enable once in the repo:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/diabetes-basics-maze-testing-w3r47i
  workflow_dispatch:

# Least-privilege token that still lets the Pages deployment run.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact (repo root, served as-is)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
